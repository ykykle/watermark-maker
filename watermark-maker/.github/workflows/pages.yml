name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const html = fs.readFileSync('watermark-maker.html');
            const png = fs.readFileSync('docs/screenshot.png');
            fs.mkdirSync('_site/docs', { recursive: true });
            fs.writeFileSync('_site/index.html', html);
            fs.writeFileSync('_site/watermark-maker.html', html);
            fs.writeFileSync('_site/docs/screenshot.png', png);
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
